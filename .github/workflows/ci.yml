name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f serving/Dockerfile -t ctr-prediction-api .

      - name: Run container
        run: docker run -d -p 8000:8000 --name ctr-api ctr-prediction-api

      - name: Wait for app to start
        run: sleep 5

      - name: Test health endpoint
        run: curl -s http://localhost:8000/health

      - name: Stop container
        run: docker stop ctr-api
