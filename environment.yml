name: ctr-prediction

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # Data processing
  - pandas=2.2
  - numpy=1.26
  - pyarrow=15
  - polars=1.39.3

  # Machine learning
  - scikit-learn=1.4
  - lightgbm=4.3

  # Visualization
  - matplotlib=3.8
  - seaborn=0.13

  # Jupyter
  - jupyter=1.0
  - jupyterlab=4.1
  - ipykernel=6.29

  # Utilities
  - tqdm=4.66
  - pyyaml=6.0

  # Code quality
  - ruff=0.3
  - black=24.3
  - pytest=8.1

  # PySpark (for Day 2 large-data aggregation)
  - pyspark=3.5
  - openjdk=17

  # Dependencies installed via pip
  - pip
  - pip:
      - kaggle==1.6.12